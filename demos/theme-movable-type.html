<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>主题预览 · 活字 Letterpress</title>
<style>
:root{
  --bg:#f3eee3; --bg2:#e9e2d4; --fg:#211c15; --fg2:#5b5145; --fg3:#8b7f6e;
  --accent:#b23a2e; --accent2:#3f5b75; --accent-rgb:178,58,46;
  --card:#fbf8f1; --card-border:#d9cfbc; --card-hover:#f6f1e6; --border:#d9cfbc;
  --input-bg:#fffdf7; --shadow:rgba(60,45,25,.18); --danger:#b23a2e;
  --paper:#e2d9c6;
}
html[data-mode=dark]{
  --bg:#1b1813; --bg2:#221e18; --fg:#ece2d0; --fg2:#b3a68e; --fg3:#7f7461;
  --accent:#e0655a; --accent2:#7fa3c4; --accent-rgb:224,101,90;
  --card:#241f19; --card-border:#3a332a; --card-hover:#2c2620; --border:#3a332a;
  --input-bg:#1c1913; --shadow:rgba(0,0,0,.5); --paper:#12100c;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:Georgia,'Songti SC','STSong','Noto Serif SC',serif;
  background:var(--bg); color:var(--fg); overflow:hidden;
  transition:background .3s,color .3s;
}
.app{height:100%;display:flex;flex-direction:column}

/* 标题栏 */
.title-bar{height:34px;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--bg2);border-bottom:1px solid var(--border);-webkit-user-select:none;user-select:none}
.brand{font-size:13px;letter-spacing:.22em;text-transform:uppercase}
.brand b{color:var(--accent);font-weight:700}
.spacer{flex:1}
.win-btn{width:26px;height:22px;border:1px solid transparent;background:transparent;color:var(--fg2);
  font-size:11px;cursor:pointer;border-radius:2px}
.win-btn:hover{background:var(--card);color:var(--fg)}
.win-btn.close:hover{background:var(--accent);color:#fff}

/* 导航：铅字条 */
.nav-bar{padding:0 22px;background:var(--bg);border-bottom:2px solid var(--fg)}
.nav-links{display:flex;gap:0}
.nav-links a{
  position:relative;padding:11px 16px 9px;font-size:14px;color:var(--fg2);text-decoration:none;cursor:pointer;
  letter-spacing:.08em;border-right:1px solid var(--border);
}
.nav-links a:first-child{border-left:1px solid var(--border)}
.nav-links a:hover{color:var(--fg);background:var(--bg2)}
.nav-links a.on{color:var(--bg);background:var(--fg)}
.nav-links a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--accent)}

.main-body{flex:1;display:flex;min-height:0}
.content{flex:1;overflow-y:auto;padding:26px 30px 40px}
.content::-webkit-scrollbar{width:11px}
.content::-webkit-scrollbar-track{background:var(--bg2)}
.content::-webkit-scrollbar-thumb{background:var(--fg3);border:3px solid var(--bg2)}

/* 书脊式 hero */
.hero{display:flex;align-items:stretch;gap:0;margin-bottom:30px;border:1px solid var(--fg);
  background:var(--card);box-shadow:5px 5px 0 var(--paper)}
.hero-spine{width:16px;background:var(--accent)}
.hero-cover{width:104px;height:150px;flex:none;margin:16px;align-self:center;
  display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;
  background:linear-gradient(135deg,var(--accent2),#2a3d4e);box-shadow:3px 3px 0 var(--paper)}
.hero-body{flex:1;padding:18px 22px 18px 6px;display:flex;flex-direction:column;justify-content:center;gap:7px}
.hero-kicker{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.hero-title{font-size:30px;line-height:1.15;font-weight:700}
.hero-sub{font-size:13px;color:var(--fg2);letter-spacing:.04em}
.hero-rule{height:1px;background:var(--border);margin:4px 0}
.hero-meter{position:relative;height:7px;background:var(--bg2);border:1px solid var(--border)}
.hero-meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:62%}
.hero-go{align-self:flex-start;margin-top:8px;padding:9px 22px;border:1px solid var(--fg);background:var(--fg);
  color:var(--bg);font-family:inherit;font-size:13px;letter-spacing:.18em;cursor:pointer}
.hero-go:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:translate(-2px,-2px);
  box-shadow:3px 3px 0 var(--paper)}
.hero-side{flex:none;width:180px;border-left:1px solid var(--border);padding:18px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.hero-side div{font-size:11px;letter-spacing:.14em;color:var(--fg3);text-transform:uppercase}
.hero-side b{display:block;font-size:22px;color:var(--fg);letter-spacing:0;font-weight:700;text-transform:none}

/* 列表头 */
.list-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.colophon{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--fg3);white-space:nowrap}
.colophon b{color:var(--accent);font-weight:700}
.search{flex:1;min-width:170px;padding:8px 12px;border:1px solid var(--border);background:var(--input-bg);
  color:var(--fg);font-family:inherit;font-size:13px;outline:none}
.search:focus{border-color:var(--accent);box-shadow:2px 2px 0 var(--paper)}
select.sel{padding:8px 10px;border:1px solid var(--border);background:var(--input-bg);color:var(--fg);
  font-family:inherit;font-size:12px;outline:none;cursor:pointer}
.tool{padding:8px 12px;border:1px solid var(--fg);background:transparent;color:var(--fg);
  font-family:inherit;font-size:12px;cursor:pointer;letter-spacing:.06em}
.tool:hover{background:var(--fg);color:var(--bg)}
.rule{height:0;border-top:1px solid var(--fg);border-bottom:1px solid var(--fg);padding:3px 0;margin:14px 0 0;
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--fg3);text-align:center}

/* 书目条目：活字版心 */
.row{display:flex;gap:16px;align-items:center;padding:16px 14px;border-bottom:1px solid var(--border);cursor:pointer;
  transition:background .15s,box-shadow .15s;position:relative}
.row:hover{background:var(--card-hover);box-shadow:inset 3px 0 0 var(--accent)}
.row.reading{background:var(--card);box-shadow:inset 3px 0 0 var(--accent2)}
.num{flex:none;width:44px;font-size:11px;letter-spacing:.1em;color:var(--fg3);text-align:right}
.cov{flex:none;width:38px;height:52px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:17px;font-weight:700;box-shadow:2px 2px 0 var(--paper)}
.info{flex:1;min-width:0}
.nm{font-size:16.5px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm .fmt{font-size:10px;font-weight:400;letter-spacing:.16em;color:var(--fg3);border:1px solid var(--border);
  padding:1px 5px;margin-left:9px;vertical-align:2px}
.met{margin-top:5px;font-size:11.5px;color:var(--fg2);letter-spacing:.04em}
.bar{margin-top:8px;height:4px;background:var(--bg2);position:relative;max-width:420px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--fg)}
.row.done .bar i{background:var(--accent2)}
.row.act .bar i{background:var(--accent)}
.pct{flex:none;width:92px;text-align:right;font-size:12px;letter-spacing:.06em;color:var(--fg2)}
.pct b{font-size:17px;color:var(--fg);font-weight:700}

/* 侧栏：版权页 */
.sidebar{flex:none;width:238px;border-left:1px solid var(--fg);background:var(--bg2);padding:24px 20px;
  display:flex;flex-direction:column;gap:0}
.side-title{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--fg3);
  padding-bottom:12px;border-bottom:2px solid var(--fg);margin-bottom:4px}
.stat{padding:15px 0;border-bottom:1px solid var(--border)}
.stat:last-child{border-bottom:none}
.stat span{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg3)}
.stat b{display:block;font-size:27px;font-weight:700;margin-top:3px}
.stat.on b{color:var(--accent)}
.seal{margin-top:auto;align-self:flex-end;width:74px;height:74px;border:2px solid var(--accent);color:var(--accent);
  display:grid;place-items:center;font-size:12px;line-height:1.5;text-align:center;letter-spacing:.1em;
  transform:rotate(-8deg);opacity:.85}

.status-bar{height:26px;flex:none;display:flex;align-items:center;gap:10px;padding:0 22px;
  border-top:1px solid var(--fg);background:var(--bg2);font-size:11px;letter-spacing:.14em;color:var(--fg3);text-transform:uppercase}

/* 预览条 */
.pv{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9;display:flex;gap:2px;
  background:var(--fg);padding:4px;box-shadow:4px 4px 0 var(--paper)}
.pv button{border:none;background:transparent;color:var(--bg);font-family:inherit;font-size:11.5px;
  letter-spacing:.12em;padding:6px 13px;cursor:pointer;text-transform:uppercase}
.pv button:hover{background:var(--accent);color:#fff}
.pv button.on{background:var(--accent);color:#fff}

@media (max-width:1080px){.hero-side{display:none}.sidebar{width:190px}}
@media (max-width:860px){.sidebar{display:none}.num{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="title-bar">
    <span class="brand"><b>活字</b> Letterpress</span><span class="spacer"></span>
    <button class="win-btn">─</button><button class="win-btn">□</button><button class="win-btn close">✕</button>
  </div>
  <div class="nav-bar"><div class="nav-links">
    <a class="on">书架</a><a>书签</a><a>便签</a><a>统计</a><a>设置</a><a>说明</a><a>日志</a>
  </div></div>
  <div class="main-body">
    <div class="content">
      <section class="hero">
        <div class="hero-spine"></div>
        <div class="hero-cover">人</div>
        <div class="hero-body">
          <div class="hero-kicker">正在排印 · Currently Setting</div>
          <div class="hero-title">人机之间</div>
          <div class="hero-sub">第十七章 · 铅与火的重铸 · 已读 1 小时 42 分</div>
          <div class="hero-rule"></div>
          <div class="hero-meter"><i></i></div>
          <button class="hero-go">继续排印 →</button>
        </div>
        <div class="hero-side">
          <div>版本<b>62%</b></div>
          <div>印张<b>312 / 504</b></div>
        </div>
      </section>

      <div class="list-head">
        <span class="colophon">本馆藏书 <b>08</b> 种</span>
        <input class="search" placeholder="检索书名…">
        <select class="sel"><option>全部格式</option><option>TXT</option><option>EPUB</option></select>
        <select class="sel"><option>全部进度</option><option>未读</option><option>在读</option></select>
        <select class="sel"><option>最近阅读</option><option>书名</option></select>
        <button class="tool">☰ 列表</button>
        <button class="tool">＋ 排版新篇</button>
      </div>
      <div class="rule">— 目 次 —</div>
      <div id="list"></div>
    </div>
    <aside class="sidebar">
      <div class="side-title">版权页</div>
      <div class="stat on"><span>藏书</span><b>8</b></div>
      <div class="stat"><span>章数</span><b>246</b></div>
      <div class="stat"><span>时长</span><b>17h</b></div>
      <div class="stat"><span>进度</span><b>62%</b></div>
      <div class="seal">活字<br>印刷</div>
    </aside>
  </div>
  <div class="status-bar"><span>就绪</span><span class="spacer"></span><span>Cardread · Demo</span></div>
</div>

<div class="pv">
  <button data-m="light" class="on">浅色</button>
  <button data-m="dark">深色</button>
  <button data-v="list" class="on">列表</button>
  <button data-v="grid">网格</button>
</div>

<script>
const BOOKS=[
 {c:'人',n:'人机之间',f:'EPUB',w:'52.4万',ch:32,p:62,s:'act'},
 {c:'京',n:'东京物语',f:'TXT',w:'18.2万',ch:14,p:100,s:'done'},
 {c:'海',n:'海底两万里',f:'EPUB',w:'25.6万',ch:24,p:38,s:'act'},
 {c:'砂',n:'沙漠的词汇',f:'MD',w:'9.8万',ch:8,p:12,s:'act'},
 {c:'星',n:'星尘往事',f:'MOBI',w:'31.0万',ch:27,p:0,s:''},
 {c:'塔',n:'玻璃塔',f:'EPUB',w:'44.1万',ch:36,p:0,s:''},
 {c:'月',n:'月照无眠',f:'TXT',w:'12.7万',ch:11,p:100,s:'done'},
 {c:'局',n:'棋局之外',f:'MD',w:'7.3万',ch:6,p:74,s:'act'},
];
const HUES=[8,205,28,150,222,340,250,45];
let view='list';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function barCls(s){return s==='done'?'done':s==='act'?'act':''}
function render(){
  const el=document.getElementById('list');
  if(view==='grid'){
    el.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px;padding-top:18px';
    el.innerHTML=BOOKS.map((b,i)=>{
      const h=HUES[i%HUES.length];
      return '<div class="card" style="border:1px solid var(--fg);background:var(--card);box-shadow:4px 4px 0 var(--paper);padding:14px;cursor:pointer">'+
        '<div style="height:96px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:700;'+
        'background:linear-gradient(135deg,hsl('+h+' 45% 42%),hsl('+h+' 55% 26%));box-shadow:2px 2px 0 var(--paper)">'+esc(b.c)+'</div>'+
        '<div style="font-size:10px;letter-spacing:.2em;color:var(--fg3);margin-top:11px">NO.'+String(i+1).padStart(2,'0')+' · '+esc(b.f)+'</div>'+
        '<div style="font-size:15px;font-weight:700;margin-top:4px;line-height:1.3">'+esc(b.n)+'</div>'+
        '<div style="font-size:11px;color:var(--fg2);margin-top:5px">'+esc(b.w)+'字 · '+b.ch+'章</div>'+
        '<div style="height:4px;background:var(--bg2);margin-top:9px;position:relative"><i style="position:absolute;inset:0 auto 0 0;width:'+b.p+'%;background:'+
        (b.s==='done'?'var(--accent2)':'var(--accent)')+'"></i></div>'+
        '<div style="font-size:11px;letter-spacing:.1em;color:var(--fg3);margin-top:7px;text-align:right">'+b.p+'%</div></div>';
    }).join('');
    return;
  }
  el.style.cssText='';
  el.innerHTML=BOOKS.map((b,i)=>{
    const h=HUES[i%HUES.length];
    return '<div class="row '+barCls(b.s)+(i===0?' reading':'')+'">'+
      '<div class="num">NO.'+String(i+1).padStart(2,'0')+'</div>'+
      '<div class="cov" style="background:linear-gradient(135deg,hsl('+h+' 45% 42%),hsl('+h+' 55% 26%))">'+esc(b.c)+'</div>'+
      '<div class="info"><div class="nm">'+esc(b.n)+'<span class="fmt">'+esc(b.f)+'</span></div>'+
      '<div class="met">'+esc(b.w)+' 字 · 共 '+b.ch+' 章 · '+(b.s==='done'?'已校毕':b.s==='act'?'在排':'未动')+'</div>'+
      '<div class="bar"><i style="width:'+b.p+'%"></i></div></div>'+
      '<div class="pct"><b>'+b.p+'</b>%</div></div>';
  }).join('');
}
document.querySelectorAll('.pv button').forEach(btn=>{
  btn.onclick=()=>{
    if(btn.dataset.m){
      document.documentElement.dataset.mode=btn.dataset.m;
      document.querySelectorAll('.pv button[data-m]').forEach(x=>x.classList.toggle('on',x===btn));
    }else{
      view=btn.dataset.v;
      document.querySelectorAll('.pv button[data-v]').forEach(x=>x.classList.toggle('on',x===btn));
      render();
    }
  };
});
document.querySelectorAll('.nav-links a').forEach(a=>{a.onclick=()=>{
  document.querySelectorAll('.nav-links a').forEach(x=>x.classList.remove('on'));a.classList.add('on');}});
render();
</script>
</body>
</html>
