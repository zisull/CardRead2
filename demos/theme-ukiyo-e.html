<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>主题预览 · 浮世绘 版元</title>
<style>
:root{
  --bg:#f3ecdd; --bg2:#e5d9c2; --fg:#1d2a45; --fg2:#4c5c78; --fg3:#93a0b3;
  --accent:#bf2b2e; --accent2:#1f4e79; --accent-rgb:191,43,46;
  --card:#fbf7ec; --card-border:#cbb890; --card-hover:#f6eeda; --border:#cbb890;
  --input-bg:#fffcf4; --shadow:rgba(29,42,69,.16); --bokashi:#dbe4e9; --gold:#a8802a;
}
html[data-mode=indigo]{
  --bg:#0b1222; --bg2:#111a2d; --fg:#e9e1cf; --fg2:#a6b1c3; --fg3:#667185;
  --accent:#e5585d; --accent2:#82b4d8; --accent-rgb:229,88,93;
  --card:#161f34; --card-border:#2b3953; --card-hover:#1c2740; --border:#2b3953;
  --input-bg:#0d1526; --shadow:rgba(0,0,0,.5); --bokashi:#1a2540; --gold:#d6ae5c;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Hiragino Mincho ProN','Yu Mincho','Songti SC','Noto Serif SC',Georgia,serif;
  background:var(--bg);color:var(--fg);overflow:hidden;transition:background .3s,color .3s}
/* 和紙肌 + 藍摺ボカシ グラデ帯 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6;
  background:radial-gradient(700px 260px at 88% 4%,var(--bokashi) 0,transparent 62%),
  repeating-linear-gradient(112deg,transparent 0 7px,rgba(0,0,0,.02) 7px 8px),
  repeating-linear-gradient(28deg,transparent 0 11px,rgba(0,0,0,.018) 11px 12px)}
.app{height:100%;display:flex;flex-direction:column;position:relative;z-index:1}

.title-bar{height:40px;display:flex;align-items:center;gap:14px;padding:0 20px;
  background:var(--accent2);color:#f5f0e3;user-select:none;letter-spacing:.2em}
html[data-mode=indigo] .title-bar{background:#080e1b;color:var(--fg2);border-bottom:1px solid var(--border)}
.mon{font-size:16px}
.mon i{font-style:normal;color:#ffd7a3}
.tb-sub{font-size:12px;opacity:.8}
.spacer{flex:1}
.win-btn{width:26px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.42);background:transparent;
  color:inherit;font-size:11px;cursor:pointer;font-family:inherit}
.win-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* 波頭ナビ */
.nav-bar{padding:14px 22px 6px}
.nav-links{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap}
.nav-links a{position:relative;text-decoration:none;cursor:pointer;font-size:14px;letter-spacing:.16em;
  color:var(--fg2);padding:8px 16px 9px;border:1px solid transparent;transition:.18s}
.nav-links a:hover{color:var(--fg);background:var(--card);border-color:var(--border)}
.nav-links a.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent2)}
.nav-links a.on::after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--accent2)}
.seigaiha{height:16px;margin-top:2px;opacity:.5;
  background:radial-gradient(circle at 50% 100%,transparent 5px,var(--accent2) 5.5px 6.5px,transparent 7px) repeat-x;
  background-size:22px 16px}

.main-body{flex:1;display:flex;min-height:0}
.content{flex:1;overflow-y:auto;padding:14px 26px 34px}
.content::-webkit-scrollbar{width:13px}
.content::-webkit-scrollbar-track{background:var(--bg2)}
.content::-webkit-scrollbar-thumb{background:var(--accent2);border:4px solid var(--bg2);border-radius:8px}

/* 一枚絵 hero */
.hero{position:relative;display:flex;gap:22px;align-items:center;padding:22px 24px;margin-bottom:24px;
  background:var(--card);border:3px double var(--accent2);box-shadow:8px 8px 0 var(--bokashi)}
.hero .fold{position:absolute;top:0;right:0;width:36px;height:36px;
  background:linear-gradient(225deg,var(--bg) 0 50%,var(--accent2) 50%)}
.hcover{flex:none;width:118px;height:168px;position:relative;display:grid;place-items:center;
  font-size:56px;color:#f8f3e7;background:linear-gradient(155deg,var(--accent2),#0f2537);border:1px solid var(--accent2)}
.hcover::after{content:"";position:absolute;inset:9px;border:1px solid rgba(255,255,255,.32)}
.hcover::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 100%,transparent 30%,rgba(255,255,255,.1) 31% 34%,transparent 35%)}
.hseal{position:absolute;left:-11px;bottom:-11px;width:50px;height:50px;border-radius:50%;background:var(--accent);
  color:#fff;display:grid;place-items:center;font-size:11px;line-height:1.2;text-align:center;
  box-shadow:0 3px 8px var(--shadow);letter-spacing:.05em}
.hbody{flex:1;min-width:0}
.hk{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent)}
.ht{font-size:31px;line-height:1.2;margin:7px 0 5px;letter-spacing:.08em}
.hs{font-size:12.5px;color:var(--fg2);letter-spacing:.05em}
.hrow{margin-top:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.owave{flex:1;min-width:140px;height:22px;overflow:hidden;position:relative;border-bottom:1px solid var(--border)}
.owave svg{position:absolute;inset:0;width:200%;height:100%;animation:drift 10s linear infinite}
@keyframes drift{to{transform:translateX(-50%)}}
.hgo{border:none;cursor:pointer;font-family:inherit;font-size:14px;letter-spacing:.3em;padding:10px 26px;
  background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent2)}
.hgo:hover{transform:translateY(3px);box-shadow:0 1px 0 var(--accent2)}
.hpc{font-size:11px;color:var(--fg3);letter-spacing:.14em}
.hpc b{font-size:22px;color:var(--fg);font-weight:400}

/* 見出し */
.list-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.mark{display:flex;align-items:center;gap:10px;font-size:14px;letter-spacing:.26em;white-space:nowrap}
.mark::before{content:"";width:0;height:0;border:9px solid transparent;border-left-color:var(--accent);border-right:0}
.mark b{color:var(--accent);font-weight:400}
.sbox{flex:1;min-width:160px;padding:8px 14px;border:1px solid var(--border);background:var(--input-bg);
  color:var(--fg);font-family:inherit;font-size:13px;outline:none;border-radius:18px}
.sbox:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.14)}
.sel,.btn{padding:8px 13px;border:1px solid var(--border);background:var(--card);color:var(--fg2);
  font-family:inherit;font-size:12.5px;cursor:pointer;border-radius:18px;letter-spacing:.06em;white-space:nowrap}
.sel:hover,.btn:hover{color:var(--accent);border-color:var(--accent)}
.btn.add{background:var(--accent2);border-color:var(--accent2);color:#f6f0e2}
.btn.add:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* 册子 — 书脊 + 算木 ProgressBar */
.vol{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--border);
  margin-bottom:12px;cursor:pointer;overflow:hidden;transition:transform .18s,box-shadow .18s}
.vol:hover{transform:translateX(5px);box-shadow:-5px 5px 0 var(--bokashi);border-color:var(--accent2)}
.vol.reading{border-color:var(--accent);box-shadow:-5px 5px 0 rgba(var(--accent-rgb),.28)}
.spine{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;color:#f7f2e5;padding:12px 0;position:relative}
.spine::before,.spine::after{content:"";position:absolute;left:9px;right:9px;height:1px;background:rgba(255,255,255,.5)}
.spine::before{top:10px}.spine::after{bottom:10px}
.spine span{writing-mode:vertical-rl;font-size:13px;letter-spacing:.14em;
  max-height:64px;overflow:hidden;text-overflow:ellipsis}
.spine i{font-style:normal;font-size:9.5px;opacity:.85;letter-spacing:.1em}
.vbody{flex:1;min-width:0;padding:13px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.vmain{flex:1;min-width:150px}
.nm{font-size:17px;letter-spacing:.05em;line-height:1.3}
.nm em{font-style:normal;font-size:10px;letter-spacing:.18em;border:1px solid var(--accent);color:var(--accent);
  padding:2px 7px;border-radius:11px;margin-left:9px;vertical-align:2px}
.met{margin-top:6px;font-size:11.5px;color:var(--fg2);letter-spacing:.04em}
.sum{font-size:9.5px;letter-spacing:.1em;color:var(--fg3);margin-top:5px}
.sum u{text-decoration:none;color:var(--accent)}
.ladder{flex:none;width:122px;height:24px;display:flex;align-items:flex-end;gap:2px}
.ladder i{flex:1;background:var(--border);border-radius:2px 2px 0 0;transition:.2s}
.ladder i.f{background:var(--accent2)}
.vol.reading .ladder i.f{background:var(--accent)}
.st{flex:none;width:74px;text-align:right}
.st b{display:block;font-size:19px;font-weight:400;line-height:1.1}
.st span{font-size:9.5px;letter-spacing:.18em;color:var(--fg3)}
.stamp{flex:none;align-self:center;width:36px;height:36px;border:2px solid var(--gold);color:var(--gold);
  border-radius:50%;display:grid;place-items:center;font-size:11px;transform:rotate(-14deg);opacity:.9}
.stamp.ink{border-color:var(--accent);color:var(--accent)}
.ghost{flex:none;width:36px}

/* 掛軸 side */
.side{flex:none;width:236px;border-left:1px solid var(--border);padding:20px 18px;display:flex;flex-direction:column;
  gap:15px;background:linear-gradient(180deg,var(--bokashi),transparent 110px)}
.hanging{background:var(--card);border:1px solid var(--border);position:relative;padding-top:7px}
.hanging::before{content:"";position:absolute;top:0;left:-1px;right:-1px;height:7px;background:var(--accent2)}
.hanging::after{content:"";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  width:44px;height:5px;background:var(--fg3);border-radius:3px}
.hanging .hd{padding:12px 14px 3px;font-size:10px;letter-spacing:.28em;color:var(--fg3);text-transform:uppercase}
.hanging .vl{padding:0 14px 14px;font-size:27px;letter-spacing:.03em}
.hanging .vl u{text-decoration:none;font-size:12px;color:var(--fg3);margin-left:5px}
.hanging.on .vl{color:var(--accent)}
.fuji{margin-top:auto}
.fuji svg{width:100%;height:80px;display:block}

.status-bar{height:30px;flex:none;display:flex;align-items:center;gap:18px;padding:0 24px;
  background:var(--accent2);color:#eef2f7;font-size:11px;letter-spacing:.2em}
html[data-mode=indigo] .status-bar{background:#080e1b;color:var(--fg3);border-top:1px solid var(--border)}
.status-bar span:last-child{margin-left:auto}

.pv{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:9;display:flex;gap:2px;padding:4px;
  background:var(--accent2);border-radius:22px;box-shadow:0 6px 18px var(--shadow)}
.pv button{border:none;background:transparent;color:#eaf0f6;font-family:inherit;font-size:12.5px;padding:7px 17px;
  cursor:pointer;border-radius:18px;letter-spacing:.12em}
.pv button:hover{background:rgba(255,255,255,.18)}
.pv button.on{background:var(--accent);color:#fff}

@media (max-width:1120px){.ladder{display:none}.side{width:196px}}
@media (max-width:880px){.side,.hseal{display:none}.spine{width:36px}.stamp,.ghost{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="title-bar">
    <span class="mon"><i>❖</i> 浮世</span><span class="tb-sub">藏書版元 · 萬年社</span><span class="spacer"></span>
    <button class="win-btn">─</button><button class="win-btn">□</button><button class="win-btn">✕</button>
  </div>
  <div class="nav-bar"><div class="nav-links">
    <a class="on">书架</a><a>书签</a><a>便签</a><a>统计</a><a>设置</a><a>说明</a><a>日志</a>
  </div></div>
  <div class="seigaiha"></div>

  <div class="main-body">
    <div class="content">
      <section class="hero">
        <div class="fold"></div>
        <div class="hcover">人<span class="hseal">御読中</span></div>
        <div class="hbody">
          <div class="hk">Now Reading · 御開卷</div>
          <div class="ht">人 機 之 間</div>
          <div class="hs">第十七幅「鉛與火的重鑄」· 已閱 一時間四十二分 · 墨色 良好</div>
          <div class="hrow">
            <div class="owave"><svg viewBox="0 0 400 22" preserveAspectRatio="none">
              <path d="M0 15 Q25 3 50 15 T100 15 T150 15 T200 15 T250 15 T300 15 T350 15 T400 15" fill="none" stroke="var(--accent2)" stroke-width="1.7"/>
              <path d="M0 19 Q25 8 50 19 T100 19 T150 19 T200 19 T250 19 T300 19 T350 19 T400 19" fill="none" stroke="var(--accent)" stroke-width="1.2" opacity=".7"/>
            </svg></div>
            <button class="hgo">再 開 卷</button>
            <div class="hpc"><b>62</b>％</div>
          </div>
        </div>
      </section>

      <div class="list-head">
        <span class="mark">藏 <b>08</b> 冊</span>
        <input class="sbox" placeholder="檢索书名 · 印元 · 格式…">
        <select class="sel"><option>全部格式</option><option>TXT</option><option>EPUB</option><option>MOBI</option></select>
        <select class="sel"><option>全部进度</option><option>未読</option><option>御読中</option><option>読み終え</option></select>
        <select class="sel"><option>最近御読</option><option>册序</option><option>入庫順</option></select>
        <button class="btn" data-v="grid">☰ 書脊</button>
        <button class="btn add">＋ 入庫</button>
      </div>

      <div id="list"></div>
    </div>

    <aside class="side">
      <div class="hanging on"><div class="hd">藏書</div><div class="vl">8<u>冊</u></div></div>
      <div class="hanging"><div class="hd">章数</div><div class="vl">246<u>幅</u></div></div>
      <div class="hanging"><div class="hd">御読時刻</div><div class="vl">17<u>時間</u></div></div>
      <div class="hanging"><div class="hd">墨含み</div><div class="vl">62<u>％</u></div></div>
      <div class="fuji"><svg viewBox="0 0 200 80" preserveAspectRatio="none">
        <path d="M0 80 L60 14 L80 40 L104 20 L142 80 Z" fill="var(--accent2)" opacity=".2"/>
        <path d="M54 22 L60 14 L68 24 L61 21 Z" fill="var(--card)"/>
        <circle cx="160" cy="22" r="9" fill="var(--accent)" opacity=".5"/>
        <path d="M0 74 Q50 58 100 68 T200 64" fill="none" stroke="var(--accent)" stroke-width="1.3" opacity=".55"/>
      </svg></div>
    </aside>
  </div>
  <div class="status-bar"><span>就绪</span><span>版元 · 浮世絵</span><span>和紙 / 藍摺</span><span class="spacer"></span><span>CARDREAD DEMO</span></div>
</div>

<div class="pv">
  <button data-m="light" class="on">和紙</button>
  <button data-m="indigo">藍摺</button>
  <button data-v="list" class="on">書脊</button>
  <button data-v="grid">並列</button>
</div>

<script>
const BOOKS=[
 {c:'人',n:'人机之间',f:'EPUB',w:'52.4万',ch:32,p:62,s:'act',x:'御読中'},
 {c:'京',n:'东京物语',f:'TXT',w:'18.2万',ch:14,p:100,s:'done',x:'読み終え'},
 {c:'海',n:'海底两万里',f:'EPUB',w:'25.6万',ch:24,p:38,s:'act',x:'御読中'},
 {c:'砂',n:'沙漠的词汇',f:'MD',w:'9.8万',ch:8,p:12,s:'act',x:'御読中'},
 {c:'星',n:'星尘往事',f:'MOBI',w:'31.0万',ch:27,p:0,s:'',x:'未読'},
 {c:'塔',n:'玻璃塔',f:'EPUB',w:'44.1万',ch:36,p:0,s:'',x:'未読'},
 {c:'月',n:'月照无眠',f:'TXT',w:'12.7万',ch:11,p:100,s:'done',x:'読み終え'},
 {c:'局',n:'棋局之外',f:'MD',w:'7.3万',ch:6,p:74,s:'act',x:'御読中'},
];
const SP=[['#1f4e79','#2f6d97'],['#7a3b2e','#a05240'],['#2b5a45','#3f7a5e'],['#544a78','#6f619a'],
 ['#7a6a2b','#9a8842'],['#33566b','#4c7791'],['#6a3350','#8a4a6b'],['#2e5a6a','#437a8c']];
let view='list';
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ladder(p){let h='';for(let i=0;i<8;i++){const f=(i+1)/8*100<=p+7;
  h+='<i class="'+(f?'f':'')+'" style="height:'+(7+(i%3)*5+(f?9:0))+'px"></i>'}return h}
function sumi(p){const n=Math.floor(p/20);return '墨'.repeat(n||0)||'空';}
function render(){
  const el=document.getElementById('list');
  if(view==='grid'){
    el.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px';
    el.innerHTML=BOOKS.map((b,i)=>{const[c1,c2]=SP[i%SP.length];
      return '<div style="background:var(--card);border:1px solid var(--border);padding:14px;cursor:pointer;'+
       'box-shadow:5px 5px 0 var(--bokashi)">'+
       '<div style="height:106px;display:grid;place-items:center;font-size:40px;color:#f8f3e7;'+
       'background:linear-gradient(155deg,'+c1+','+c2+');border:1px solid '+c1+'">'+esc(b.c)+'</div>'+
       '<div style="font-size:9.5px;letter-spacing:.2em;color:var(--fg3);margin-top:11px">'+esc(b.f)+' · 第'+
       String(i+1).padStart(2,'0')+'冊</div>'+
       '<div style="font-size:16px;margin-top:3px;letter-spacing:.04em">'+esc(b.n)+'</div>'+
       '<div style="font-size:11px;color:var(--fg2);margin-top:5px">'+esc(b.w)+'字 · '+b.ch+'幅</div>'+
       '<div class="ladder" style="width:100%;margin-top:10px">'+ladder(b.p)+'</div>'+
       '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--fg3);margin-top:7px">'+
       '<span>'+esc(b.x)+'</span><span>'+sumi(b.p)+'</span></div></div>';
    }).join('');return;
  }
  el.style.cssText='';
  el.innerHTML=BOOKS.map((b,i)=>{const[c1,c2]=SP[i%SP.length];
    return '<div class="vol '+b.s+(i===0?' reading':'')+'">'+
      '<div class="spine" style="background:linear-gradient(180deg,'+c1+','+c2+')">'+
        '<span>'+esc(b.n).slice(0,4)+'</span><i>'+String(i+1).padStart(2,'0')+'</i></div>'+
      '<div class="vbody"><div class="vmain"><div class="nm">'+esc(b.n)+'<em>'+esc(b.x)+'</em></div>'+
        '<div class="met">'+esc(b.f)+' · '+esc(b.w)+' 字 · 全 '+b.ch+' 幅 · 入庫 08-'+String(11+i)+'</div>'+
        '<div class="sum">墨含み <u>'+sumi(b.p)+'</u> · '+b.p+'%</div></div>'+
      '<div class="ladder">'+ladder(b.p)+'</div>'+
      '<div class="st"><b>'+b.p+'</b><span>％</span></div>'+
      (b.s==='done'?'<div class="stamp ink">畢</div>':'<div class="ghost"></div>')+
      '</div></div>';
  }).join('');
}
document.querySelectorAll('.pv button').forEach(btn=>{btn.onclick=()=>{
  if(btn.dataset.m){document.documentElement.dataset.mode=btn.dataset.m;
    document.querySelectorAll('.pv button[data-m]').forEach(x=>x.classList.toggle('on',x===btn));return}
  view=btn.dataset.v;
  document.querySelectorAll('.pv button[data-v]').forEach(x=>x.classList.toggle('on',x===btn));
  render();
}});
document.querySelectorAll('.nav-links a').forEach(a=>{a.onclick=()=>{
  document.querySelectorAll('.nav-links a').forEach(x=>x.classList.remove('on'));a.classList.add('on')}});
render();
</script>
</body>
</html>
