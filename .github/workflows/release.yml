name: Build & Release

# 推 tag 即发布：build 三平台 → release 建 release（含各平台包 + latest.json）并一次性放出来。
# 更新清单和产物在同一个作业里发布，不存在「release 已公开但 latest.json 还没挂上」的空窗。
# workflow_dispatch 只出构建产物到 Actions 页，不碰 release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            artifact: CardRead2-Windows-x64.exe
            package: CardRead2-Windows-x64.zip
          - os: ubuntu-22.04
            platform: Linux
            artifact: CardRead2-Linux-x64
            package: CardRead2-Linux-x64.tar.gz
          # 不再构建 macOS Intel：GitHub 已下线 macos-13 类 Intel runner，作业会永远排队
          # （v0.0.4 那次就卡死在这一个任务上，把 release 一起拖没）。Intel Mac 走下载页。
          - os: macos-14
            platform: macOS-arm64
            artifact: CardRead2-macOS-arm64
            package: CardRead2-macOS-arm64.zip

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    name: Build ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev patchelf

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard
          pip install confull chardet loguru ebooklib beautifulsoup4 lxml mobi mistune pypinyin
          if [ "$RUNNER_OS" = "Windows" ]; then
            pip install pythonnet pywebview
          elif [ "$RUNNER_OS" = "macOS" ]; then
            pip install pywebview pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-WebKit
          else
            pip install pywebview
          fi

      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --jobs=4 `
            --output-dir=dist `
            --output-filename=CardRead2-Windows-x64.exe `
            --windows-icon-from-ico=src/icon.ico `
            --windows-console-mode=disable `
            --no-prefer-source-code `
            --include-package=src `
            --include-package=confull `
            --include-package=chardet `
            --include-package=loguru `
            --include-package=ebooklib `
            --include-package=bs4 `
            --include-package=lxml `
            --include-package=mobi `
            --include-package=mistune `
            --include-package=pypinyin `
            --include-package-data=pypinyin `
            --include-module=clr `
            --include-package=clr_loader `
            --include-package=pythonnet `
            --include-package=bottle `
            --include-package=proxy_tools `
            --include-package=webview `
            --include-module=webview.platforms.winforms `
            --include-module=webview.platforms.edgechromium `
            --include-package-data=pythonnet `
            --include-package-data=clr_loader `
            --include-package-data=webview `
            --include-data-dir=src/web/static=static `
            --include-data-files=src/icon.ico=icon.ico `
            --nofollow-import-to=tkinter `
            --nofollow-import-to=unittest `
            --nofollow-import-to=test `
            --disable-plugin=pywebview `
            --assume-yes-for-downloads `
            --remove-output `
            src/web/main.py

      - name: Build with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --jobs=4 \
            --output-dir=dist \
            --output-filename=CardRead2-Linux-x64 \
            --no-prefer-source-code \
            --include-package=src \
            --include-package=confull \
            --include-package=chardet \
            --include-package=loguru \
            --include-package=ebooklib \
            --include-package=bs4 \
            --include-package=lxml \
            --include-package=mobi \
            --include-package=mistune \
            --include-package=pypinyin \
            --include-package-data=pypinyin \
            --include-package=bottle \
            --include-package=proxy_tools \
            --include-package=webview \
            --include-module=webview.platforms.gtk \
            --include-package-data=webview \
            --include-data-dir=src/web/static=static \
            --include-data-files=src/icon.ico=icon.ico \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=unittest \
            --nofollow-import-to=test \
            --disable-plugin=pywebview \
            --assume-yes-for-downloads \
            --remove-output \
            src/web/main.py

      - name: Build with Nuitka (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --jobs=4 \
            --output-dir=dist \
            --output-filename=${{ matrix.artifact }} \
            --macos-create-app-bundle \
            --no-prefer-source-code \
            --include-package=src \
            --include-package=confull \
            --include-package=chardet \
            --include-package=loguru \
            --include-package=ebooklib \
            --include-package=bs4 \
            --include-package=lxml \
            --include-package=mobi \
            --include-package=mistune \
            --include-package=pypinyin \
            --include-package-data=pypinyin \
            --include-package=bottle \
            --include-package=proxy_tools \
            --include-package=webview \
            --include-module=webview.platforms.cocoa \
            --include-package-data=webview \
            --include-data-dir=src/web/static=static \
            --include-data-files=src/icon.ico=icon.ico \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=unittest \
            --nofollow-import-to=test \
            --disable-plugin=pywebview \
            --assume-yes-for-downloads \
            --remove-output \
            src/web/main.py

      - name: Package artifacts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path dist/CardRead2-Windows-x64.exe -DestinationPath dist/CardRead2-Windows-x64.zip -Force"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            tar -czf dist/CardRead2-Linux-x64.tar.gz -C dist CardRead2-Linux-x64
          else
            ditto -c -k --sequesterRsrc --keepParent "dist/${{ matrix.artifact }}" "dist/${{ matrix.package }}"
          fi

      - name: Upload package as Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}
          if-no-files-found: error
          retention-days: 30

  # 发布只在这一个作业里发生：产物 + latest.json 先挂到草稿上，全部就位后再取消草稿。
  # 这样外部看不到「release 已公开但清单还 404」的窗口——老版本客户端只读
  # releases/latest/download/latest.json（静态资产，不受匿名 API 限流影响）。
  # if 用 !cancelled()：个别平台构建失败时剩下的平台照常发；全失败时脚本因无产物而退出，
  # 草稿根本不会被创建，也就不会推出一个谁都更新不了的版本。
  release:
    name: Publish release + latest.json
    needs: build
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Collect built packages
        uses: actions/download-artifact@v4.3.0
        with:
          path: dist
          pattern: 'CardRead2-*'
          merge-multiple: true
          # merge-multiple 是必需的：默认每个产物会落进 dist/<产物名>/ 子目录，
          # 而 make_update_manifest.py 是在 dist/ 平铺找文件的

      - name: Build update manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" 2>/dev/null || true
          # 更新说明取 tag 的批注正文（git tag -a -m "标题" -m "正文"），没有就退回整条批注
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || printf '本版本更新内容见提交历史。\n' > notes.md
          python tools/make_update_manifest.py --dir dist --tag "$GITHUB_REF_NAME" \
            --out dist/latest.json --notes-file notes.md \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Attach everything to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft=true --title "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" \
              --notes-file notes.md dist/*
          fi

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

